<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect x="0" y="0" width="1080" height="1920" fill="#0B1F17"/>
  <!-- left accent bar -->
  <rect x="0" y="0" width="18" height="1920" fill="#15A862"/>
  <!-- top: mini logo -->
  <text x="70" y="150" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="#F4F6F4">THE TOUCHLINE</text>
  <rect x="70" y="168" width="430" height="6" fill="#E8FF3A"/>
  <!-- series pill -->
  <rect x="70" y="230" width="360" height="74" rx="37" fill="#15A862"/>
  <text x="100" y="280" font-family="Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#0B1F17">THE BREAKDOWN</text>
  <!-- HOOK headline (edit this text) -->
  <text x="68" y="900" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="150" fill="#F4F6F4">YOUR</text>
  <text x="68" y="1060" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="150" fill="#E8FF3A">HOOK</text>
  <text x="68" y="1220" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="150" fill="#F4F6F4">HERE</text>
  <!-- bottom: chalk line + handle -->
  <rect x="70" y="1780" width="940" height="8" fill="#E8FF3A"/>
  <text x="70" y="1850" font-family="Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="2" fill="#9FB3A8">@thetouchline</text>
</svg>
